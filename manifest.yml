app:
  id: ari:cloud:ecosystem::app/6a5e2447-a58d-4cc4-8c56-12c73cb3b5a0
  runtime:
    name: nodejs24.x

modules:
  function:
    - key: resolver
      handler: backend/index.handler

  webtrigger:
    - key: sync-webtrigger
      function: resolver

  scheduledTrigger:
    - key: reconciliation-trigger
      function: resolver
      interval: hour

  jira:projectPage:
    - key: shipsignal-project-page
      resource: main
      resolver:
        function: resolver
      title: ShipSignal

  confluence:spacePage:
    - key: shipsignal-space-page
      resource: main
      resolver:
        function: resolver
      title: ShipSignal
      route: shipsignal

  rovo:agent:
    - key: shipsignal-agent
      name: ShipSignal Agent
      description: Evidence-backed release intelligence assistant.
      prompt: |
        You are the ShipSignal agent. Retrieve evidence before answering.
        Never invent records. Distinguish facts from inference.
      actions:
        - get-release-readiness
        - get-release-blockers

  action:
    - key: get-release-readiness
      name: Get Release Readiness
      function: resolver
      actionVerb: GET
      description: Get release readiness assessment.
    - key: get-release-blockers
      name: Get Release Blockers
      function: resolver
      actionVerb: GET
      description: Get release blockers.
    - key: get-project-health
      name: Get Project Health
      function: resolver
      actionVerb: GET
      description: Get integration health.
    - key: get-change-impact
      name: Get Change Impact
      function: resolver
      actionVerb: GET
      description: Get change impact.
    - key: get-service-dependencies
      name: Get Service Dependencies
      function: resolver
      actionVerb: GET
      description: Get service dependencies.
    - key: get-risk-evidence
      name: Get Risk Evidence
      function: resolver
      actionVerb: GET
      description: Get risk evidence.
    - key: generate-release-report
      name: Generate Release Report
      function: resolver
      actionVerb: GET
      description: Generate release report.
    - key: create-remediation-task
      name: Create Remediation Task
      function: resolver
      actionVerb: POST
      description: Create remediation task.
    - key: update-risk-status
      name: Update Risk Status
      function: resolver
      actionVerb: POST
      description: Update risk status.

  rovo:mcp:
    - key: shipsignal-mcp
      name: ShipSignal MCP
      tools:
        - get-release-readiness
        - get-release-blockers
        - get-project-health
        - get-change-impact
        - get-service-dependencies
        - get-risk-evidence
        - generate-release-report
        - create-remediation-task
        - update-risk-status

resources:
  - key: main
    path: static/frontend

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:confluence-content.all
    - read:confluence-space.summary
    - read:component:compass
    - storage:app
  external:
    fetch:
      backend:
        - address: "*.atlassian.net"
        - address: api.bitbucket.org
        - address: api.atlassian.com

remotes: []
