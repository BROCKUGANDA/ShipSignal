app:
  id: ari:cloud:ecosystem::app/6a5e2447-a58d-4cc4-8c56-12c73cb3b5a0
  runtime:
    name: nodejs24.x

modules:
  sql:
    - key: shipsignal-sql
      engine: mysql

  function:
    - key: resolver
      handler: backend/index.handler
    - key: actions
      handler: backend/index.actionHandler
    - key: sync-trigger
      handler: backend/index.webtriggerHandler
    - key: scheduled-sync
      handler: backend/index.scheduledHandler

  webtrigger:
    - key: sync-webtrigger
      function: sync-trigger

  scheduledTrigger:
    - key: reconciliation-trigger
      function: scheduled-sync
      interval: hour

  jira:projectPage:
    - key: shipsignal-project-page
      resource: main
      resolver:
        function: resolver
      title: ShipSignal

  confluence:spacePage:
    - key: shipsignal-space-page
      resource: main
      resolver:
        function: resolver
      title: ShipSignal
      route: shipsignal

  rovo:agent:
    - key: shipsignal-agent
      name: ShipSignal Agent
      description: Evidence-backed release intelligence assistant.
      prompt: |
        You are the ShipSignal agent. Retrieve evidence before answering.
        Never invent records. Distinguish facts from inference.
      actions:
        - get-release-readiness
        - get-release-blockers
        - get-project-health
        - get-change-impact
        - get-service-dependencies
        - get-risk-evidence
        - generate-release-report

  action:
    - key: get-release-readiness
      name: Get Release Readiness
      function: actions
      actionVerb: GET
      description: Get a deterministic release readiness assessment with cited evidence.
      inputs:
        releaseId:
          title: Release ID
          type: string
          required: true
          description: ShipSignal release identifier.
    - key: get-release-blockers
      name: Get Release Blockers
      function: actions
      actionVerb: GET
      description: List blockers for a release with source evidence.
      inputs:
        releaseId:
          title: Release ID
          type: string
          required: true
          description: ShipSignal release identifier.
    - key: get-project-health
      name: Get Project Health
      function: actions
      actionVerb: GET
      description: Check Jira, Bitbucket, Confluence, Compass, and Teamwork Graph health.
      inputs: {}
    - key: get-change-impact
      name: Get Change Impact
      function: actions
      actionVerb: GET
      description: Find evidence related to a change, pull request, or issue identifier.
      inputs:
        changeId:
          title: Change identifier
          type: string
          required: true
          description: Commit, change, pull request, or issue identifier.
    - key: get-service-dependencies
      name: Get Service Dependencies
      function: actions
      actionVerb: GET
      description: Return Compass and evidence-derived service dependencies.
      inputs:
        releaseId:
          title: Release ID
          type: string
          required: false
          description: Optional release identifier.
    - key: get-risk-evidence
      name: Get Risk Evidence
      function: actions
      actionVerb: GET
      description: Return cited evidence records for a workspace or release.
      inputs:
        releaseId:
          title: Release ID
          type: string
          required: false
          description: Optional release identifier.
        limit:
          title: Limit
          type: integer
          required: false
          description: Maximum records to return (1-100).
    - key: generate-release-report
      name: Generate Release Report
      function: actions
      actionVerb: GET
      description: Generate a release readiness report with factors, blockers, and evidence.
      inputs:
        releaseId:
          title: Release ID
          type: string
          required: true
          description: ShipSignal release identifier.
        format:
          title: Format
          type: string
          required: false
          description: summary, markdown, or json.
    - key: create-remediation-task
      name: Create Remediation Task
      function: actions
      actionVerb: CREATE
      description: Create a Jira remediation task after explicit confirmation.
      inputs:
        releaseId:
          title: Release ID
          type: string
          required: true
          description: ShipSignal release identifier.
        summary:
          title: Summary
          type: string
          required: true
          description: Jira task summary.
        description:
          title: Description
          type: string
          required: false
          description: Optional task description.
        projectKey:
          title: Project key
          type: string
          required: false
          description: Jira project key; defaults to the release project.
        confirm:
          title: Confirm
          type: boolean
          required: true
          description: Must be true. The agent must ask the user before setting this.
    - key: update-risk-status
      name: Update Risk Status
      function: actions
      actionVerb: UPDATE
      description: Record a human risk-status decision with a reason.
      inputs:
        releaseId:
          title: Release ID
          type: string
          required: true
          description: ShipSignal release identifier.
        status:
          title: Status
          type: string
          required: true
          description: READY, AT_RISK, BLOCKED, or INCOMPLETE.
        reason:
          title: Reason
          type: string
          required: true
          description: Why the status is changing.
        confirm:
          title: Confirm
          type: boolean
          required: true
          description: Must be true. The agent must ask the user before setting this.

  rovo:mcp:
    - key: shipsignal-mcp
      name: ShipSignal MCP
      tools:
        - get-release-readiness
        - get-release-blockers
        - get-project-health
        - get-change-impact
        - get-service-dependencies
        - get-risk-evidence
        - generate-release-report
        - create-remediation-task
        - update-risk-status

resources:
  - key: main
    path: static/frontend

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:confluence-content.all
    - read:confluence-space.summary
    - read:component:compass
    - storage:app
  external:
    fetch:
      backend:
        - address: "*.atlassian.net"
        - address: api.bitbucket.org
        - address: api.atlassian.com

remotes: []
